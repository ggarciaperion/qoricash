{% extends "base.html" %}
{% block title %}Prospectos WA — QoriCash{% endblock %}

{% block head %}
<style>
.pp { max-width:1340px; margin:0 auto; padding:20px 16px 60px; }

/* ── Header ── */
.pp-hdr { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.pp-hdr h1 { font-size:1.2rem; font-weight:700; color:#0f172a; margin:0; }
.pp-search {
  flex:1; min-width:180px; max-width:300px;
  display:flex; align-items:center; gap:6px;
  background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:0 10px;
}
.pp-search input { border:none; outline:none; background:transparent; font-size:.85rem; color:#334155; width:100%; padding:8px 0; }
.pp-search i { color:#94a3b8; }
.pp-refresh { padding:7px 12px; border-radius:8px; border:1px solid #e2e8f0; background:#fff; color:#334155; cursor:pointer; font-size:.82rem; }
.pp-refresh:hover { background:#f1f5f9; }

/* ── Tabs ── */
.pp-tabs { display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:0; gap:0; }
.pp-tab {
  padding:11px 20px; font-size:.85rem; font-weight:600; color:#64748b;
  cursor:pointer; border:none; background:none;
  border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap;
}
.pp-tab:hover { color:#196BFE; }
.pp-tab.active { color:#196BFE; border-bottom-color:#196BFE; }
.pp-tab-n {
  display:inline-block; padding:1px 8px; border-radius:10px;
  font-size:.7rem; font-weight:700; margin-left:5px;
  background:#f1f5f9; color:#64748b;
}
.pp-tab.active .pp-tab-n { background:#dbeafe; color:#196BFE; }
/* semáforo en tabs */
.pp-tab .sem-dot {
  display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:5px; vertical-align:middle;
}
.sem-dot.verde  { background:#22c55e; }
.sem-dot.ambar  { background:#f59e0b; }
.sem-dot.rojo   { background:#ef4444; }

/* ── Bulk bar ── */
.pp-bulk {
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px;
  padding:9px 14px; margin:12px 0 0;
}
.pp-bulk.show { display:flex; }
.pp-bulk-info { font-size:.82rem; font-weight:600; color:#1e40af; flex:1; min-width:120px; }
.pp-bulk-send {
  padding:7px 16px; border-radius:7px; border:none; background:#196BFE; color:#fff;
  font-size:.82rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px;
}
.pp-bulk-send:hover { background:#1558d6; }
.pp-bulk-clear { background:none; border:none; color:#64748b; font-size:.78rem; cursor:pointer; padding:4px 8px; }

/* ── Table ── */
.pp-wrap { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; margin-top:0; }
.pp-table { width:100%; border-collapse:collapse; font-size:.81rem; }
.pp-table thead th {
  background:#f8fafc; color:#64748b; font-size:.7rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em;
  padding:9px 10px; text-align:left; border-bottom:1px solid #e2e8f0; white-space:nowrap;
}
.pp-table tbody tr:hover { background:#f8fafc; }
.pp-table tbody tr.sel   { background:#eff6ff; }
.pp-table tbody td { padding:8px 10px; border-bottom:1px solid #f1f5f9; color:#334155; vertical-align:middle; }
.pp-table tbody tr:last-child td { border-bottom:none; }

/* Semáforo bar */
.pp-sem-col { width:5px; padding:0 !important; }
.pp-sem-bar { width:4px; height:38px; border-radius:2px; margin:0 auto; }
.pp-sem-bar.verde  { background:#22c55e; }
.pp-sem-bar.ambar  { background:#f59e0b; }
.pp-sem-bar.rojo   { background:#ef4444; }
.pp-sem-bar.none   { background:#e2e8f0; }

/* Company */
.pp-co   { font-weight:600; color:#0f172a; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pp-rub  { font-size:.68rem; color:#94a3b8; }

/* Contact */
.pp-cn   { color:#334155; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pp-cg   { font-size:.68rem; color:#94a3b8; }

/* WA badge */
.pp-wa { display:inline-block; padding:1px 7px; border-radius:20px; font-size:.67rem; font-weight:700; white-space:nowrap; }
.pp-wa.con_wa       { color:#16a34a; background:#f0fdf4; border:1px solid #bbf7d0; }
.pp-wa.sin_wa       { color:#dc2626; background:#fef2f2; border:1px solid #fecaca; }
.pp-wa.sin_historial{ color:#64748b; background:#f8fafc; border:1px solid #e2e8f0; }
.pp-wa.bot_session  { color:#7c3aed; background:#f5f3ff; border:1px solid #ddd6fe; }

/* Contact date cell */
.pp-cdate { font-size:.75rem; }
.pp-cdate-fecha { font-weight:600; color:#0f172a; }
.pp-cdate-estado { font-size:.68rem; margin-top:2px; }
.pp-est { display:inline-block; padding:1px 7px; border-radius:20px; font-size:.67rem; font-weight:600; }
.pp-est.enviado   { color:#196BFE; background:#eff6ff; }
.pp-est.entregado { color:#16a34a; background:#f0fdf4; }
.pp-est.leido     { color:#0369a1; background:#e0f2fe; }
.pp-est.respondio { color:#7c3aed; background:#f5f3ff; }

/* Actions */
.pp-acts { display:flex; gap:5px; }
.pp-btn { display:inline-flex; align-items:center; gap:3px; padding:4px 10px; border-radius:6px; border:none; font-size:.73rem; font-weight:600; cursor:pointer; }
.pp-btn:hover { opacity:.85; }
.pp-btn.chat { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
.pp-btn.send { background:#196BFE; color:#fff; }

/* Pagination */
.pp-pag { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-top:1px solid #e2e8f0; font-size:.78rem; color:#64748b; }
.pp-pag-btn { padding:5px 14px; border-radius:7px; border:1px solid #e2e8f0; background:#f8fafc; color:#334155; font-size:.78rem; cursor:pointer; }
.pp-pag-btn:disabled { opacity:.4; cursor:not-allowed; }
.pp-pag-btn:hover:not(:disabled) { background:#e2e8f0; }

.pp-empty   { text-align:center; padding:48px; color:#94a3b8; font-size:.85rem; }
.pp-loading { text-align:center; padding:36px; color:#94a3b8; font-size:.85rem; }

/* ── Send Modal ── */
.pp-modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999; align-items:center; justify-content:center; }
.pp-modal-bg.open { display:flex; }
.pp-modal-box { background:#fff; border-radius:14px; padding:26px 28px; width:460px; max-width:95vw; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.pp-modal-box h5 { font-size:.95rem; font-weight:700; color:#0f172a; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
.pp-mrow { display:flex; gap:10px; margin-bottom:12px; }
.pp-mrow > div { flex:1; }
.pp-mlabel { font-size:.73rem; font-weight:600; color:#64748b; display:block; margin-bottom:4px; }
.pp-minput, .pp-mselect {
  width:100%; padding:9px 11px; border:1px solid #e2e8f0; border-radius:8px;
  font-size:.85rem; color:#0f172a; background:#f8fafc; outline:none; font-family:inherit; box-sizing:border-box;
}
.pp-minput:focus, .pp-mselect:focus { border-color:#196BFE; background:#fff; }
.pp-minfo { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:9px 13px; font-size:.8rem; color:#166534; margin-bottom:14px; }
.pp-mactions { display:flex; gap:8px; justify-content:flex-end; }
.pp-mcancel { background:none; border:1px solid #e2e8f0; color:#64748b; padding:8px 18px; border-radius:8px; cursor:pointer; font-size:.85rem; }
.pp-msend   { background:#196BFE; color:#fff; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:.85rem; font-weight:600; }
.pp-msend:disabled { opacity:.5; cursor:not-allowed; }

/* Progress */
.pp-prog { display:none; margin-bottom:12px; }
.pp-prog.show { display:block; }
.pp-prog-bar-wrap { background:#e2e8f0; border-radius:4px; height:6px; margin:6px 0; }
.pp-prog-bar { background:#196BFE; height:6px; border-radius:4px; transition:width .3s; }
.pp-prog-lbl { font-size:.75rem; color:#64748b; }
</style>
{% endblock %}

{% block content %}
<div class="pp">

  <!-- Header -->
  <div class="pp-hdr">
    <div>
      <h1><i class="bi bi-whatsapp" style="color:#22c55e;"></i> Prospectos WA</h1>
    </div>
    <div class="pp-search">
      <i class="bi bi-search"></i>
      <input type="text" id="ppQ" placeholder="Empresa, nombre, teléfono…" oninput="ppDebounce()">
    </div>
    <button class="pp-refresh" onclick="ppLoad()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
  </div>

  <!-- Tabs -->
  <div class="pp-tabs">
    <button class="pp-tab active" data-tab="todos"       onclick="ppTab('todos',this)">
      Todos <span class="pp-tab-n" id="tn-todos">0</span>
    </button>
    <button class="pp-tab" data-tab="disponibles" onclick="ppTab('disponibles',this)">
      Disponibles <span class="pp-tab-n" id="tn-disp">0</span>
    </button>
    <button class="pp-tab" data-tab="c1" onclick="ppTab('c1',this)">
      <span class="sem-dot verde"></span>1er contacto <span class="pp-tab-n" id="tn-c1">0</span>
    </button>
    <button class="pp-tab" data-tab="c2" onclick="ppTab('c2',this)">
      <span class="sem-dot ambar"></span>2do contacto <span class="pp-tab-n" id="tn-c2">0</span>
    </button>
    <button class="pp-tab" data-tab="c3" onclick="ppTab('c3',this)">
      <span class="sem-dot rojo"></span>3er contacto <span class="pp-tab-n" id="tn-c3">0</span>
    </button>
  </div>

  <!-- Bulk bar -->
  <div class="pp-bulk" id="ppBulk">
    <span class="pp-bulk-info" id="ppBulkInfo">0 seleccionados</span>
    <button class="pp-bulk-send" id="ppBulkSendBtn" onclick="ppAbrirModal()">
      <i class="bi bi-send-fill"></i> <span id="ppBulkSendLabel">Enviar WA</span>
    </button>
    <button class="pp-bulk-clear" onclick="ppDesel()">✕ Deseleccionar</button>
  </div>

  <!-- Table -->
  <div class="pp-wrap">
    <div id="ppTable"><div class="pp-loading"><i class="bi bi-arrow-clockwise spin"></i> Cargando…</div></div>
    <div class="pp-pag" id="ppPag" style="display:none">
      <button class="pp-pag-btn" id="ppPrev" onclick="ppPage--; ppLoad()">← Anterior</button>
      <span id="ppPagInfo"></span>
      <button class="pp-pag-btn" id="ppNext" onclick="ppPage++; ppLoad()">Siguiente →</button>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="pp-modal-bg" id="ppModal">
  <div class="pp-modal-box">
    <h5><i class="bi bi-send-fill" style="color:#196BFE;"></i> <span id="ppModalTitle">Enviar campaña WA</span></h5>
    <div class="pp-minfo">Se enviará a <b id="ppModalN">0</b> prospectos seleccionados.</div>
    <div class="pp-mrow">
      <div>
        <label class="pp-mlabel">Nombre de campaña</label>
        <input class="pp-minput" type="text" id="ppMCamp" placeholder="Nov2026-C1">
      </div>
      <div>
        <label class="pp-mlabel">Plantilla</label>
        <select class="pp-mselect" id="ppMPlan"></select>
      </div>
    </div>
    <div class="pp-mrow">
      <div>
        <label class="pp-mlabel">TC Compra (S/)</label>
        <input class="pp-minput" type="text" id="ppMComp" placeholder="3.377">
      </div>
      <div>
        <label class="pp-mlabel">TC Venta (S/)</label>
        <input class="pp-minput" type="text" id="ppMVent" placeholder="3.381">
      </div>
    </div>
    <div class="pp-prog" id="ppProg">
      <div class="pp-prog-lbl" id="ppProgLbl">Enviando…</div>
      <div class="pp-prog-bar-wrap"><div class="pp-prog-bar" id="ppProgBar" style="width:0%"></div></div>
    </div>
    <div class="pp-mactions">
      <button class="pp-mcancel" id="ppMCancel" onclick="ppCerrar()">Cancelar</button>
      <button class="pp-msend"   id="ppMSend"   onclick="ppEnviar()"><i class="bi bi-send"></i> Enviar ahora</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── Estado ──────────────────────────────────────────────────────
let ppCurTab  = 'todos';
let ppPage    = 1;
let ppQ       = '';
let ppRows    = [];
let ppSel     = new Set();
let ppTimer   = null;
const PER_PG  = 100;
const MESES   = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function csrf() {
  return document.querySelector('meta[name="csrf-token"]')?.content || '';
}

// ── Cargar datos ─────────────────────────────────────────────────
async function ppLoad() {
  document.getElementById('ppTable').innerHTML = '<div class="pp-loading"><i class="bi bi-arrow-clockwise spin"></i> Cargando…</div>';
  document.getElementById('ppPag').style.display = 'none';

  const url = `/crm/api/prospectos-panel?tab=${ppCurTab}&page=${ppPage}&q=${encodeURIComponent(ppQ)}`;
  try {
    const r    = await fetch(url, { credentials:'same-origin' });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'Error');

    const t = data.tabs || {};
    document.getElementById('tn-todos').textContent = t.todos      || 0;
    document.getElementById('tn-disp').textContent  = t.disponibles|| 0;
    document.getElementById('tn-c1').textContent    = t.c1         || 0;
    document.getElementById('tn-c2').textContent    = t.c2         || 0;
    document.getElementById('tn-c3').textContent    = t.c3         || 0;

    ppRows = data.rows || [];
    ppRender(ppRows);

    const total = data.total || 0;
    const pages = Math.ceil(total / PER_PG);
    if (pages > 1) {
      document.getElementById('ppPag').style.display = 'flex';
      document.getElementById('ppPagInfo').textContent = `Página ${ppPage} de ${pages} · ${total} registros`;
      document.getElementById('ppPrev').disabled = ppPage <= 1;
      document.getElementById('ppNext').disabled = ppPage >= pages;
    }
  } catch(e) {
    document.getElementById('ppTable').innerHTML = `<div class="pp-loading" style="color:#dc2626;">Error: ${esc(e.message)}</div>`;
  }
}

// ── Render tabla (columnas cambian según pestaña) ─────────────────
function ppRender(rows) {
  if (!rows.length) {
    document.getElementById('ppTable').innerHTML = '<div class="pp-empty">Sin registros para este filtro.</div>';
    return;
  }

  let head = '', body = '';

  if (ppCurTab === 'todos') {
    head = `<tr>
      <th style="width:24px"><input type="checkbox" id="ppAll" onchange="ppSelAll(this.checked)"></th>
      <th style="width:5px"></th>
      <th>Empresa</th>
      <th>Contacto</th>
      <th>Teléfono</th>
      <th>Contactos WA</th>
      <th>Último WA</th>
      <th>Resultado</th>
      <th>Acciones</th>
    </tr>`;
    body = rows.map(r => {
      const c  = r.contactos || [];
      const ult = c.length ? c[c.length-1] : null;
      return `<tr id="ppr-${esc(r.numero)}" class="${ppSel.has(r.numero)?'sel':''}">
        <td><input type="checkbox" class="ppck" data-n="${esc(r.numero)}" ${ppSel.has(r.numero)?'checked':''} onchange="ppToggle(this)"></td>
        <td class="pp-sem-col"><div class="pp-sem-bar ${r.semaforo}"></div></td>
        <td><div class="pp-co" title="${esc(r.empresa)}">${esc(r.empresa)||'—'}</div><div class="pp-rub">${esc(r.rubro)}</div></td>
        <td><div class="pp-cn">${esc(r.nombre)||'—'}</div><div class="pp-cg">${esc(r.cargo)}</div></td>
        <td><div style="font-size:.8rem;font-family:monospace">${esc(r.numero)}</div><span class="pp-wa ${r.wa_validado}">${ppWaLbl(r.wa_validado)}</span></td>
        <td style="text-align:center;font-size:.82rem;font-weight:700;color:${semColor(r.semaforo)}">${r.num_contactos}</td>
        <td>${ult ? `<div class="pp-cdate"><div class="pp-cdate-fecha">${esc(ult.fecha)}</div><div class="pp-cdate-estado">${estadoBadge(ult)}</div></div>` : '<span style="color:#cbd5e1">—</span>'}</td>
        <td>${resultBadge(r.resultado)}</td>
        <td><div class="pp-acts">
          <a href="/crm/whatsapp?n=${encodeURIComponent(r.numero_e164)}" class="pp-btn chat" target="_blank"><i class="bi bi-chat-dots-fill"></i></a>
          <button class="pp-btn send" onclick="ppEnviarUno('${esc(r.numero)}')"><i class="bi bi-send"></i></button>
        </div></td>
      </tr>`;
    }).join('');

  } else if (ppCurTab === 'disponibles') {
    head = `<tr>
      <th style="width:24px"><input type="checkbox" id="ppAll" onchange="ppSelAll(this.checked)"></th>
      <th>Empresa</th>
      <th>Contacto / Cargo</th>
      <th>Teléfono</th>
      <th>Email recibido</th>
      <th>Resultado</th>
      <th>Acciones</th>
    </tr>`;
    body = rows.map(r => `<tr id="ppr-${esc(r.numero)}" class="${ppSel.has(r.numero)?'sel':''}">
      <td><input type="checkbox" class="ppck" data-n="${esc(r.numero)}" ${ppSel.has(r.numero)?'checked':''} onchange="ppToggle(this)"></td>
      <td><div class="pp-co" title="${esc(r.empresa)}">${esc(r.empresa)||'—'}</div><div class="pp-rub">${esc(r.rubro)}</div></td>
      <td><div class="pp-cn">${esc(r.nombre)||'—'}</div><div class="pp-cg">${esc(r.cargo)}</div></td>
      <td><div style="font-size:.8rem;font-family:monospace">${esc(r.numero)}</div><span class="pp-wa ${r.wa_validado}">${ppWaLbl(r.wa_validado)}</span></td>
      <td style="font-size:.75rem;color:#64748b">${esc(r.fecha_email)||'—'}</td>
      <td>${resultBadge(r.resultado)}</td>
      <td><div class="pp-acts">
        <button class="pp-btn send" onclick="ppEnviarUno('${esc(r.numero)}')"><i class="bi bi-send"></i> 1er contacto</button>
      </div></td>
    </tr>`).join('');

  } else if (ppCurTab === 'c1') {
    head = `<tr>
      <th style="width:24px"><input type="checkbox" id="ppAll" onchange="ppSelAll(this.checked)"></th>
      <th>Empresa</th>
      <th>Contacto</th>
      <th>Teléfono</th>
      <th style="color:#22c55e">1er Contacto WA</th>
      <th>Días</th>
      <th>Resultado</th>
      <th>Acciones</th>
    </tr>`;
    body = rows.map(r => {
      const c1 = r.contactos?.[0];
      const dias = c1 ? diasDesde(c1.fecha) : null;
      return `<tr id="ppr-${esc(r.numero)}" class="${ppSel.has(r.numero)?'sel':''}">
        <td><input type="checkbox" class="ppck" data-n="${esc(r.numero)}" ${ppSel.has(r.numero)?'checked':''} onchange="ppToggle(this)"></td>
        <td><div class="pp-co" title="${esc(r.empresa)}">${esc(r.empresa)||'—'}</div><div class="pp-rub">${esc(r.rubro)}</div></td>
        <td><div class="pp-cn">${esc(r.nombre)||'—'}</div><div class="pp-cg">${esc(r.cargo)}</div></td>
        <td><div style="font-size:.8rem;font-family:monospace">${esc(r.numero)}</div><span class="pp-wa ${r.wa_validado}">${ppWaLbl(r.wa_validado)}</span></td>
        <td>${c1 ? `<div class="pp-cdate"><div class="pp-cdate-fecha">${esc(c1.fecha)}</div><div class="pp-cdate-estado">${estadoBadge(c1)}</div></div>` : '—'}</td>
        <td>${diasBadge(dias)}</td>
        <td>${resultBadge(r.resultado)}</td>
        <td><div class="pp-acts">
          <a href="/crm/whatsapp?n=${encodeURIComponent(r.numero_e164)}" class="pp-btn chat" target="_blank"><i class="bi bi-chat-dots-fill"></i></a>
          <button class="pp-btn send" onclick="ppEnviarUno('${esc(r.numero)}')"><i class="bi bi-send"></i> 2do</button>
        </div></td>
      </tr>`;
    }).join('');

  } else if (ppCurTab === 'c2') {
    head = `<tr>
      <th style="width:24px"><input type="checkbox" id="ppAll" onchange="ppSelAll(this.checked)"></th>
      <th>Empresa</th>
      <th>Contacto</th>
      <th>Teléfono</th>
      <th style="color:#22c55e">1er Contacto</th>
      <th style="color:#f59e0b">2do Contacto</th>
      <th>Días</th>
      <th>Acciones</th>
    </tr>`;
    body = rows.map(r => {
      const c1 = r.contactos?.[0], c2 = r.contactos?.[1];
      const dias = c2 ? diasDesde(c2.fecha) : null;
      return `<tr id="ppr-${esc(r.numero)}" class="${ppSel.has(r.numero)?'sel':''}">
        <td><input type="checkbox" class="ppck" data-n="${esc(r.numero)}" ${ppSel.has(r.numero)?'checked':''} onchange="ppToggle(this)"></td>
        <td><div class="pp-co" title="${esc(r.empresa)}">${esc(r.empresa)||'—'}</div><div class="pp-rub">${esc(r.rubro)}</div></td>
        <td><div class="pp-cn">${esc(r.nombre)||'—'}</div><div class="pp-cg">${esc(r.cargo)}</div></td>
        <td><div style="font-size:.8rem;font-family:monospace">${esc(r.numero)}</div></td>
        <td>${c1 ? `<div class="pp-cdate"><div class="pp-cdate-fecha">${esc(c1.fecha)}</div>${estadoBadge(c1)}</div>` : '—'}</td>
        <td>${c2 ? `<div class="pp-cdate"><div class="pp-cdate-fecha">${esc(c2.fecha)}</div>${estadoBadge(c2)}</div>` : '—'}</td>
        <td>${diasBadge(dias)}</td>
        <td><div class="pp-acts">
          <a href="/crm/whatsapp?n=${encodeURIComponent(r.numero_e164)}" class="pp-btn chat" target="_blank"><i class="bi bi-chat-dots-fill"></i></a>
          <button class="pp-btn send" onclick="ppEnviarUno('${esc(r.numero)}')"><i class="bi bi-send"></i> 3er</button>
        </div></td>
      </tr>`;
    }).join('');

  } else { // c3
    head = `<tr>
      <th>Empresa</th>
      <th>Contacto</th>
      <th>Teléfono</th>
      <th style="color:#22c55e">1er Contacto</th>
      <th style="color:#f59e0b">2do Contacto</th>
      <th style="color:#ef4444">3er Contacto</th>
      <th>Total</th>
      <th>Chat</th>
    </tr>`;
    body = rows.map(r => {
      const c1=r.contactos?.[0], c2=r.contactos?.[1], c3=r.contactos?.[2];
      return `<tr>
        <td><div class="pp-co" title="${esc(r.empresa)}">${esc(r.empresa)||'—'}</div><div class="pp-rub">${esc(r.rubro)}</div></td>
        <td><div class="pp-cn">${esc(r.nombre)||'—'}</div><div class="pp-cg">${esc(r.cargo)}</div></td>
        <td><div style="font-size:.8rem;font-family:monospace">${esc(r.numero)}</div></td>
        <td>${c1 ? `<div class="pp-cdate-fecha">${esc(c1.fecha)}</div>${estadoBadge(c1)}` : '—'}</td>
        <td>${c2 ? `<div class="pp-cdate-fecha">${esc(c2.fecha)}</div>${estadoBadge(c2)}` : '—'}</td>
        <td>${c3 ? `<div class="pp-cdate-fecha">${esc(c3.fecha)}</div>${estadoBadge(c3)}` : '—'}</td>
        <td style="text-align:center;font-weight:700;color:#ef4444">${r.num_contactos}</td>
        <td><a href="/crm/whatsapp?n=${encodeURIComponent(r.numero_e164)}" class="pp-btn chat" target="_blank"><i class="bi bi-chat-dots-fill"></i> Chat</a></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('ppTable').innerHTML = `
    <table class="pp-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// ── Helpers visuales ──────────────────────────────────────────────
function semColor(s) {
  return { verde:'#16a34a', ambar:'#d97706', rojo:'#dc2626', none:'#94a3b8' }[s] || '#94a3b8';
}
function ppWaLbl(v) {
  return { con_wa:'✓ Con WA', sin_wa:'✗ Sin WA', sin_historial:'? Pendiente', bot_session:'🤖 Bot' }[v] || v;
}
function estadoBadge(c) {
  if (!c) return '';
  if (c.respondio) return `<span class="pp-est respondio">✓ Respondió</span>`;
  const lbl = { enviado:'Enviado', entregado:'Entregado ✓✓', leido:'Leído 👁' };
  return `<span class="pp-est ${c.estado}">${lbl[c.estado]||c.estado}</span>`;
}
function resultBadge(r) {
  if (!r) return '<span style="color:#cbd5e1;font-size:.7rem">—</span>';
  const col = { CLIENTE:'#16a34a', INTERESADO:'#0369a1', COTIZO:'#7c3aed', REBOTADO:'#dc2626' };
  const bg  = { CLIENTE:'#f0fdf4', INTERESADO:'#e0f2fe', COTIZO:'#f5f3ff', REBOTADO:'#fef2f2' };
  const c   = col[r]||'#64748b', b = bg[r]||'#f8fafc';
  return `<span style="font-size:.68rem;font-weight:700;color:${c};background:${b};padding:1px 7px;border-radius:4px">${esc(r)}</span>`;
}
function diasDesde(fechaStr) {
  if (!fechaStr) return null;
  const [d,m,y] = fechaStr.split('/').map(Number);
  if (!d||!m||!y) return null;
  const ms = new Date() - new Date(y,m-1,d);
  return Math.floor(ms/86400000);
}
function diasBadge(d) {
  if (d===null||d===undefined) return '—';
  const cls = d>=14?'color:#dc2626;font-weight:700': d>=7?'color:#d97706;font-weight:600':'color:#64748b';
  return `<span style="font-size:.78rem;${cls}">${d}d</span>`;
}

// ── Selección ─────────────────────────────────────────────────────
function ppToggle(chk) {
  const n = chk.dataset.n;
  if (chk.checked) ppSel.add(n); else ppSel.delete(n);
  const tr = document.getElementById(`ppr-${n}`);
  if (tr) tr.classList.toggle('sel', chk.checked);
  ppActBulk();
}
function ppSelAll(v) {
  document.querySelectorAll('.ppck').forEach(c => {
    c.checked = v;
    if (v) ppSel.add(c.dataset.n); else ppSel.delete(c.dataset.n);
    const tr = document.getElementById(`ppr-${c.dataset.n}`);
    if (tr) tr.classList.toggle('sel', v);
  });
  ppActBulk();
}
function ppDesel() {
  ppSel.clear();
  document.querySelectorAll('.ppck').forEach(c => { c.checked=false; });
  document.querySelectorAll('[id^="ppr-"]').forEach(r => r.classList.remove('sel'));
  const a = document.getElementById('ppAll'); if(a) a.checked=false;
  ppActBulk();
}
function ppActBulk() {
  const n = ppSel.size;
  document.getElementById('ppBulk').classList.toggle('show', n>0);
  document.getElementById('ppBulkInfo').textContent = `${n} prospecto${n!==1?'s':''} seleccionado${n!==1?'s':''}`;
  const lbl = { todos:'Enviar WA', disponibles:'Enviar 1er contacto', c1:'Enviar 2do contacto', c2:'Enviar 3er contacto', c3:'— Máx. alcanzado' };
  document.getElementById('ppBulkSendLabel').textContent = lbl[ppCurTab]||'Enviar WA';
}

// ── Tabs y navegación ─────────────────────────────────────────────
function ppTab(tab, el) {
  ppCurTab = tab; ppPage = 1; ppDesel();
  document.querySelectorAll('.pp-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ppLoad();
}
function ppDebounce() {
  clearTimeout(ppTimer);
  ppTimer = setTimeout(()=>{ ppQ=document.getElementById('ppQ').value.trim(); ppPage=1; ppLoad(); }, 400);
}

// ── Modal de envío ─────────────────────────────────────────────────
function ppNombreCamp(n) {
  const now=new Date(); return `${MESES[now.getMonth()]}${now.getFullYear()}-C${n}`;
}
function ppContactoNum() {
  return { disponibles:1, c1:2, c2:3 }[ppCurTab] || 1;
}
function ppAbrirModal() {
  if (ppCurTab==='c3') return;
  const n = ppContactoNum();
  document.getElementById('ppModalTitle').textContent = `Enviar ${n===1?'1er':n===2?'2do':'3er'} contacto WA`;
  document.getElementById('ppMCamp').value = ppNombreCamp(n);
  document.getElementById('ppModalN').textContent = ppSel.size;
  document.getElementById('ppProg').classList.remove('show');
  document.getElementById('ppMSend').disabled = false;
  document.getElementById('ppMSend').innerHTML = '<i class="bi bi-send"></i> Enviar ahora';
  document.getElementById('ppMCancel').textContent = 'Cancelar';
  document.getElementById('ppModal').classList.add('open');
}
function ppEnviarUno(num) {
  ppSel.clear(); ppSel.add(num); ppActBulk(); ppAbrirModal();
}
function ppCerrar() { document.getElementById('ppModal').classList.remove('open'); }

async function ppEnviar() {
  const camp   = document.getElementById('ppMCamp').value.trim();
  const plan   = document.getElementById('ppMPlan').value.trim();
  const compra = document.getElementById('ppMComp').value.trim();
  const venta  = document.getElementById('ppMVent').value.trim();
  if (!camp)         { alert('Escribe el nombre de la campaña'); return; }
  if (!compra||!venta){ alert('Ingresa el tipo de cambio'); return; }

  const prospectos = [...ppSel].map(num => {
    const row = ppRows.find(r => r.numero===num);
    return { prospecto_id:row?.id||null, numero:row?row.numero_e164:`+51${num}`, nombre:row?.nombre||'', empresa:row?.empresa||'' };
  });

  document.getElementById('ppMSend').disabled = true;
  document.getElementById('ppMSend').innerHTML = '<i class="bi bi-hourglass-split"></i> Enviando…';
  document.getElementById('ppProg').classList.add('show');
  document.getElementById('ppMCancel').textContent = 'Cerrar';

  let ok=0, err=0;
  const BATCH=50;
  for (let i=0; i<prospectos.length; i+=BATCH) {
    const lote = prospectos.slice(i, i+BATCH);
    try {
      const r = await fetch('/wa-prospectos/api/enviar', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body:JSON.stringify({campana:camp, plantilla:plan, compra, venta, prospectos:lote, pausa_seg:1}),
      });
      if (!r.ok) { err+=lote.length; continue; }
      const j = await r.json();
      if (j.ok) { ok+=j.resumen?.enviados||0; err+=(j.resumen?.fallidos||0)+(j.resumen?.sin_wa||0); }
      else       { err+=lote.length; }
    } catch(e) { err+=lote.length; }
    const done=Math.min(i+BATCH, prospectos.length);
    const pct=Math.round(done/prospectos.length*100);
    document.getElementById('ppProgBar').style.width = pct+'%';
    document.getElementById('ppProgLbl').textContent = `Enviando ${done} / ${prospectos.length}…`;
  }

  const hayErr = err>0;
  document.getElementById('ppProgBar').style.background = hayErr?'#f59e0b':'#22c55e';
  document.getElementById('ppProgLbl').textContent = hayErr
    ? `Enviados: ${ok}  |  Sin WA / Error: ${err}`
    : `✓ Enviados: ${ok} mensajes`;
  document.getElementById('ppMSend').innerHTML = hayErr ? '⚠ Revisar errores' : '✓ Completado';
  ppDesel();
  if (!hayErr) setTimeout(()=>{ ppCerrar(); ppLoad(); }, 1800);
  else ppLoad();
}

// ── Cargar plantillas ──────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/wa-prospectos/api/plantillas', {credentials:'same-origin'});
    const d = await r.json();
    const sel = document.getElementById('ppMPlan');
    if (sel && d.plantillas?.length) {
      sel.innerHTML = d.plantillas.map(p=>`<option value="${esc(p.nombre)}">${esc(p.label)}</option>`).join('');
    }
  } catch(e){}
})();

document.getElementById('ppModal').addEventListener('click', e=>{ if(e.target===document.getElementById('ppModal')) ppCerrar(); });
ppLoad();
</script>
