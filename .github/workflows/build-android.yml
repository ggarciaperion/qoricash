name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --non-interactive

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64,os; open('android/app/qoricash-release.jks','wb').write(base64.urlsafe_b64decode(os.environ['KEYSTORE_B64']))"
          echo "Keystore size: $(wc -c < android/app/qoricash-release.jks) bytes"
          xxd android/app/qoricash-release.jks | head -2

      - name: Verify keystore with keytool
        run: |
          keytool -list -keystore android/app/qoricash-release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -storetype JKS 2>&1 || true

      - name: Configure release signing in gradle.properties
        run: |
          echo "" >> android/gradle.properties
          echo "MYAPP_STORE_FILE=qoricash-release.jks" >> android/gradle.properties
          echo "MYAPP_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Patch build.gradle for release signing
        run: |
          sed -i 's/signingConfig signingConfigs.debug \/\/ release/signingConfig signingConfigs.release/' android/app/build.gradle || true
          python3 - <<'EOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          release_signing = '''
              release {
                  storeFile file(MYAPP_STORE_FILE)
                  storePassword MYAPP_STORE_PASSWORD
                  keyAlias MYAPP_KEY_ALIAS
                  keyPassword MYAPP_KEY_PASSWORD
              }
          '''

          # Add release signing config if not already there
          if 'MYAPP_STORE_FILE' not in content:
              content = content.replace(
                  'signingConfigs {\n        debug {',
                  'signingConfigs {\n        release {\n            storeFile file(project.findProperty("MYAPP_STORE_FILE") ?: "debug.keystore")\n            storePassword project.findProperty("MYAPP_STORE_PASSWORD") ?: "android"\n            keyAlias project.findProperty("MYAPP_KEY_ALIAS") ?: "androiddebugkey"\n            keyPassword project.findProperty("MYAPP_KEY_PASSWORD") ?: "android"\n        }\n        debug {'
              )
              # Update release buildType to use release signingConfig
              content = content.replace(
                  'release {\n            // Caution!',
                  'release {\n            signingConfig signingConfigs.release\n            // Caution!'
              )
              with open('android/app/build.gradle', 'w') as f:
                  f.write(content)
              print("build.gradle patched successfully")
          else:
              print("build.gradle already patched")
          EOF

      - name: Build Android Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoricash-release-v7.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
