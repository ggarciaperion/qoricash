name: Build & Submit Android

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build & Submit Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --non-interactive

      - name: Fix release signing in build.gradle
        run: |
          python3 - <<'PYEOF'
          with open('android/app/build.gradle', 'r') as f:
              c = f.read()
          # Add release signingConfig block before debug block
          if 'MYAPP_STORE_FILE' not in c:
              c = c.replace(
                  'signingConfigs {\n        debug {',
                  'signingConfigs {\n        release {\n            storeFile file(project.findProperty("MYAPP_STORE_FILE") ?: "debug.keystore")\n            storePassword (project.findProperty("MYAPP_STORE_PASSWORD") ?: "android")\n            keyAlias (project.findProperty("MYAPP_KEY_ALIAS") ?: "androiddebugkey")\n            keyPassword (project.findProperty("MYAPP_KEY_PASSWORD") ?: "android")\n        }\n        debug {'
              )
          # Replace debug signing in release buildType (unique context: followed by def enableShrinkResources)
          c = c.replace(
              'signingConfig signingConfigs.debug\n            def enableShrinkResources',
              'signingConfig signingConfigs.release\n            def enableShrinkResources'
          )
          with open('android/app/build.gradle', 'w') as f:
              f.write(c)
          print('build.gradle signing fixed')
          PYEOF

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64,os; ks=os.environ['KEYSTORE_B64'].strip(); pad=ks+'='*((4-len(ks)%4)%4); open('android/app/qoricash-release.jks','wb').write(base64.b64decode(pad))"
          echo "Keystore decoded: $(wc -c < android/app/qoricash-release.jks) bytes"

      - name: Verify keystore
        run: |
          keytool -list -keystore android/app/qoricash-release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -storetype JKS 2>&1 || true

      - name: Configure release signing
        run: |
          echo "" >> android/gradle.properties
          echo "MYAPP_STORE_FILE=qoricash-release.jks" >> android/gradle.properties
          echo "MYAPP_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Build Android Bundle (AAB)
        run: cd android && ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoricash-release-v9.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Submit to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.qoricash.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
